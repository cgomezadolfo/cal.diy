name: Build and publish agenda image

on:
  push:
    branches: [agenda]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: build
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U build"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      # Cal.com's build is memory-hungry (NODE_OPTIONS defaults to
      # --max-old-space-size=6144) and standard runners only have 7GB RAM.
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The build needs a reachable, migrated database (see docs/plan-despliegue.md).
      - name: Migrate build database
        run: npx --yes prisma migrate deploy --schema packages/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cal.diy:latest
            ghcr.io/${{ github.repository_owner }}/cal.diy:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=https://agenda.systemlabs.cl
            NEXT_PUBLIC_LICENSE_CONSENT=true
            CALCOM_TELEMETRY_DISABLED=1
            DATABASE_URL=postgresql://build:build@localhost:5432/build
            DATABASE_DIRECT_URL=postgresql://build:build@localhost:5432/build
